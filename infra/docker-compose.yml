services:
  postgres:
    image: postgres:17.11-alpine3.23
    container_name: bazaar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bazaar
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: bazaar_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaar -d bazaar"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8.0.32-noble
    container_name: bazaar-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: bazaar
      MONGO_INITDB_ROOT_PASSWORD: bazaar_dev_only
      MONGO_INITDB_DATABASE: bazaar
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "bazaar",
          "--password",
          "bazaar_dev_only",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.4.12-bookworm
    container_name: bazaar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.56.1
    container_name: bazaar-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: bazaar_dev_master_key_change_me
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:7700/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  meilisearch_data:
